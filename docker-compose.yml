version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gmnex-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gmnex}
      POSTGRES_USER: ${POSTGRES_USER:-gmnex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gmnex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gmnex} -d ${POSTGRES_DB:-gmnex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gmnex-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gmnex-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      Database_URL: postgresql://${POSTGRES_USER:-gmnex}:${POSTGRES_PASSWORD:-gmnex}@postgres:5432/${POSTGRES_DB:-gmnex}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_SHORT_CODE: ${MPESA_SHORT_CODE}
      MPESA_PASSKEY: ${MPESA_PASSKEY}
      MPESA_ENVIRONMENT: ${MPESA_ENVIRONMENT:-sandbox}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL}
      SITE_URL: ${SITE_URL:-http://localhost:5173}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gmnex-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gmnex-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gmnex-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  gmnex-network:
    driver: bridge